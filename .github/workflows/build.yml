name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Find the newest NewPipeExtractor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api repos/TeamNewPipe/NewPipeExtractor/releases/latest --jq .tag_name || true)
          echo "Using NewPipeExtractor ${TAG:-default}"
          echo "NPE_VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Build
        run: gradle assembleRelease -PnpeVersion="$NPE_VERSION" -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "OfflineDownloads-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineDownloads-1.0.${{ github.run_number }}
          path: OfflineDownloads-*.apk

      - name: Publish as a release (easy to download on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Offline Downloads 1.0.${{ github.run_number }}
          files: OfflineDownloads-*.apk
          make_latest: true
