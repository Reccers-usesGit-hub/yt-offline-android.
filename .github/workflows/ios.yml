name: Build iPhone/iPad app

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          X=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $X"
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (unsigned — your sideloading tool signs it)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project OfflineDownloads.xcodeproj \
            -scheme OfflineDownloads \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unavailable)|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Save build errors to the build-logs branch
        if: failure()
        working-directory: ios
        run: |
          grep -E "error:|warning: unable|fatal" build.log | sort -u | head -200 > errors.txt || true
          tail -300 build.log > tail.txt
          for l in $(head -10 errors.txt | tr ' ' '_'); do echo "::error::${l//_/ }"; done
          git config user.name "build bot"; git config user.email "bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rfq --cached . >/dev/null
          git add -f errors.txt tail.txt
          git commit -qm "iOS build ${{ github.run_number }} log"
          git push -fq origin build-logs

      - name: Make the .ipa
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/OfflineDownloads.app
          ls "$APP" "$APP/PlugIns"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr "../OfflineDownloads-iOS-1.0.${{ github.run_number }}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineDownloads-iOS-1.0.${{ github.run_number }}
          path: OfflineDownloads-iOS-*.ipa

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: Offline Downloads for iPhone/iPad 1.0.${{ github.run_number }}
          files: OfflineDownloads-iOS-*.ipa
          make_latest: false
